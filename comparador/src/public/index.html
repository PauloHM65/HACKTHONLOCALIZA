<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Rotas: EV vs Combustão</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <div class="container">
        <h1>⚡ EV vs ⛽ Combustão</h1>
        <p>Compare o custo de viagem entre um carro elétrico e um a combustão.</p>

        <div class="form-group">
            <label for="origem">Ponto de Partida</label>
            <input type="text" id="origem" placeholder="Ex: São Paulo, SP">
        </div>

        <div class="form-group">
            <label for="destino">Destino</label>
            <input type="text" id="destino" placeholder="Ex: Rio de Janeiro, RJ">
        </div>

        <button onclick="calcularRota()">Comparar Consumo</button>

        <!-- Resultado (começa escondido) -->
        <div id="resultado" class="hidden">
            <h2>Distância: <span id="distancia">--</span> km</h2>

            <div class="cards">
                <div class="card eletrico">
                    <h3 id="el-nome">--</h3>
                    <p id="el-gasto" class="small">--</p>
                    <p><strong>R$ <span id="el-custo">--</span></strong></p>
                </div>

                <div class="card combustao">
                    <h3 id="comb-nome">--</h3>
                    <p id="comb-gasto" class="small">--</p>
                    <p><strong>R$ <span id="comb-custo">--</span></strong></p>
                </div>
            </div>

            <div class="conclusao">
                <p>🏆 Mais barato: <strong id="vencedor">--</strong></p>
                <p>Economia de R$ <strong id="diferenca">--</strong></p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
